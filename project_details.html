<style>

    .telemetry-grid {

    /* README gövdesi: ana sayfanın tipografi ölçeğiyle aynı */

    .readme-body ol { list-style: decimal; }
    .readme-body li { margin: .35em 0; }

    .readme-body code {

    .readme-body pre code { background: transparent; color: inherit; padding: 0; font-size: inherit; }
    .readme-body img { max-width: 100%; height: auto; border-radius: .5rem; border: 1px solid rgba(199,196,216,.5); margin: 1em 0; }
    .readme-body blockquote {
        border-left: 3px solid #311fca; background: rgba(49,31,202,.05);
        padding: .6em 1em; margin: 1.25em 0; border-radius: 0 .5rem .5rem 0; color: #191c1e;

    .readme-body hr { border: 0; border-top: 1px solid rgba(199,196,216,.6); margin: 2em 0; }
    /* Geniş tablolar mobilde sayfayı taşırmasın diye kendi kutusunda kayar */
    .readme-body .table-wrap { overflow-x: auto; margin: 1.25em 0; border: 1px solid rgba(199,196,216,.6); border-radius: .5rem; }
    .readme-body table { border-collapse: collapse; width: 100%; font-size: 14px; }
    .readme-body th { background: #f2f4f6; color: #191c1e; font-weight: 600; text-align: left; }
    .readme-body th, .readme-body td { padding: .55em .8em; border-bottom: 1px solid rgba(199,196,216,.5); white-space: nowrap; }
    .readme-body tr:last-child td { border-bottom: 0; }
    .readme-body details { margin-top: 2.5em; border: 1px solid rgba(199,196,216,.6); border-radius: .5rem; background: #f7f9fb; }
    .readme-body details > summary {
        cursor: pointer; list-style: none; padding: 1rem 1.25rem; min-height: 44px;
        font-family: 'Montserrat', sans-serif; font-weight: 600; color: #191c1e;
        display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .readme-body details > summary::-webkit-details-marker { display: none; }
    .readme-body details > summary::after { content: '+'; font-family: 'JetBrains Mono', monospace; color: #311fca; font-size: 20px; }
    .readme-body details[open] > summary::after { content: '−'; }
    .readme-body details > .details-body { padding: 0 1.25rem 1.25rem; }
    .readme-body details h2 { margin-top: 1.4em; font-size: 20px; }
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
</style>

<!-- Sürüm sabit: CDN'deki "latest" değişince sayfa sessizce bozulmasın -->
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script>
(() => {
    const USER = 'ugurhandasdemir';
    const key = new URLSearchParams(location.search).get('repo');

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
    const icon = (id, size = 'w-4 h-4') =>
        `<svg aria-hidden="true" class="icon ${size}"><use href="#${id}"/></svg>`;
    const chip = (text, tone = 'neutral') => {
        const toneClass = tone === 'primary'
            ? 'text-primary bg-primary/10'
            : 'text-secondary bg-secondary-container/30';
        return `<span class="font-label-sm text-label-sm ${toneClass} px-3 py-1 rounded-full">${esc(text)}</span>`;
    };
    const formatDate = value => {
        const [year, month] = String(value || '').split('-').map(Number);
        if (!year || !month) return '';
        return new Date(year, month - 1).toLocaleDateString('tr-TR', { year: 'numeric', month: 'short' });
    };
    const setStatus = html => { $('readme-status').innerHTML = html; };

    // Okuyucuya değil kuran kişiye yönelik bölümler en alta, kapalı bir kutuya alınır
    const SETUP_HEADING = /kurulum|gereksinim|çalıştır|calistir|kullanım|kullanim|proje yapısı|dizin yapısı|install|requirement|usage|setup|getting started|troubleshoot|sorun giderme|\brun\b/i;

    const renderHeader = (project, ghRepo, index, total) => {
        const name = project.name || key;
        $('project-title').textContent = name;
        document.title = `${name} | Uğurhan Daşdemir`;
        document.querySelector('meta[name="description"]')
            .setAttribute('content', project.summary || `${name} projesinin teknik detayları.`);

        const number = index >= 0 ? `${String(index + 1).padStart(2, '0')} / ${String(total).padStart(2, '0')}` : 'PROJE';
        $('project-meta').innerHTML = `
            <span class="inline-flex items-center justify-center h-8 px-2.5 rounded-lg bg-primary/10 font-telemetry text-sm text-primary">${esc(number)}</span>
            ${project.date ? chip(formatDate(project.date)) : ''}
            ${project.context ? chip(project.context, 'primary') : ''}`;
        $('project-summary').textContent = project.summary || '';
        $('project-stack').innerHTML = (project.stack || []).map(s => chip(s)).join('');

        const actions = [];
        const repoUrl = project.link || (ghRepo ? `https://github.com/${USER}/${encodeURIComponent(ghRepo)}` : null);
        if (repoUrl) {
            actions.push(`<a class="inline-flex items-center gap-2 font-label-md text-label-md bg-primary text-on-primary px-5 py-3 rounded-lg hover:bg-primary/90 transition-colors" href="${esc(repoUrl)}" target="_blank" rel="noopener">${icon('i-github', 'w-5 h-5')}GitHub'da Aç</a>`);
        }
        if (project.youtube) {
            actions.push(`<a class="inline-flex items-center gap-2 font-label-md text-label-md border border-outline-variant text-on-surface px-5 py-3 rounded-lg hover:bg-surface-container-low transition-colors" href="${esc(project.youtube)}" target="_blank" rel="noopener">${icon('i-play', 'w-5 h-5')}Videoyu İzle</a>`);
        }
        $('project-actions').innerHTML = actions.join('');

        const image = project.image ? `/${String(project.image).replace(/^\/+/, '')}` : null;
        $('project-media').innerHTML = image
            ? `<img alt="${esc(name)}" class="w-full h-full object-cover" decoding="async" height="384" src="${esc(image)}" width="640">`
            : `<div class="telemetry-grid w-full h-full flex items-center justify-center p-6">
                   <span class="font-telemetry text-label-sm text-primary uppercase tracking-widest text-center">${esc((project.stack || []).slice(0, 3).join(' · '))}</span>
               </div>`;
    };

    const renderNext = (projects, index) => {
        if (index < 0 || projects.length < 2) return;
        const next = projects[(index + 1) % projects.length];
        const target = next.link
            ? null
            : `/project_details.html?repo=${encodeURIComponent(next.slug || next.repo)}`;
        const href = target || next.link;
        const external = target ? '' : ' target="_blank" rel="noopener"';
        $('next-project').innerHTML = `
            <a class="group flex items-center justify-between gap-6 bg-surface-pure rounded-xl border border-outline-variant/30 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 p-6 md:p-8" href="${esc(href)}"${external}>
                <span>
                    <span class="block font-telemetry text-label-sm text-on-surface-variant uppercase tracking-widest mb-2">Sonraki proje</span>
                    <span class="block font-headline-md text-headline-md text-on-surface group-hover:text-primary transition-colors">${esc(next.name)}</span>
                </span>
                <span class="shrink-0 w-11 h-11 rounded-full bg-primary/10 text-primary flex items-center justify-center">${icon('i-arrow', 'w-5 h-5')}</span>
            </a>`;
        $('next-project').classList.remove('hidden');
    };

    // Markdown → HTML; README başlığı sayfa başlığını tekrar etmesin, göreli yollar repo'ya bağlansın
    const renderMarkdown = (md, ghRepo) => {
        const html = window.marked
            ? marked.parse(md)
            : `<pre>${esc(md)}</pre>`;
        const tmp = document.createElement('div');
        tmp.innerHTML = html;

        const firstHeading = tmp.querySelector('h1');
        if (firstHeading) firstHeading.remove();
        tmp.querySelectorAll('h1').forEach(h => {
            const h2 = document.createElement('h2');
            h2.innerHTML = h.innerHTML;
            h.replaceWith(h2);
        });

        if (ghRepo) {
            const rawBase = `https://raw.githubusercontent.com/${USER}/${ghRepo}/HEAD/`;
            const blobBase = `https://github.com/${USER}/${ghRepo}/blob/HEAD/`;
            tmp.querySelectorAll('img[src]').forEach(img => {
                const src = img.getAttribute('src');
                if (src && !/^https?:|^data:|^\/\//.test(src)) img.setAttribute('src', rawBase + src.replace(/^\.?\//, ''));
            });
            tmp.querySelectorAll('a[href]').forEach(a => {
                const href = a.getAttribute('href');
                if (href && !/^https?:|^#|^mailto:|^\/\//.test(href)) a.setAttribute('href', blobBase + href.replace(/^\.?\//, ''));
            });
        }
        tmp.querySelectorAll('img').forEach(img => { img.loading = 'lazy'; img.decoding = 'async'; });
        tmp.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
        tmp.querySelectorAll('table').forEach(table => {
            const wrap = document.createElement('div');
            wrap.className = 'table-wrap';
            table.replaceWith(wrap);
            wrap.appendChild(table);
        });

        // Kurulum gibi bölümleri (h2 ve altındaki her şey) tek bir açılır kutuya taşı
        const setupNodes = [];
        let inSetup = false;
        [...tmp.childNodes].forEach(node => {
            if (node.nodeName === 'H2') inSetup = SETUP_HEADING.test(node.textContent);
            if (inSetup) setupNodes.push(node);
        });
        if (setupNodes.length) {
            const details = document.createElement('details');
            details.innerHTML = '<summary>Kurulum ve teknik ayrıntılar</summary><div class="details-body"></div>';
            setupNodes.forEach(node => details.querySelector('.details-body').appendChild(node));
            tmp.appendChild(details);
        }

        setStatus('');
        $('readme-status').classList.add('hidden');
        $('readme').innerHTML = tmp.innerHTML;
    };

    const fetchText = (url, accept) =>
        fetch(url, accept ? { headers: { Accept: accept } } : undefined)
            .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); });

    if (!key) {
        $('project-title').textContent = 'Proje seçilmedi';
        setStatus('Ana sayfadaki projelerden birini seçin. <a class="text-primary underline" href="/#projects">Projelere dön</a>');
        return;
    }

    fetch('/repos.json', { cache: 'no-cache' })
        .then(r => (r.ok ? r.json() : {}))
        .catch(() => ({}))
        .then(data => {
            const projects = data.projects || [];
            const index = projects.findIndex(p => p.slug === key || p.repo === key);
            const project = index >= 0 ? projects[index] : { name: key };
            const manual = (data.manual || []).find(m => m.slug === key || m.repo === key);
            const mdPath = manual && manual.details ? `/${String(manual.details).replace(/^\/+/, '')}` : null;
            // Elle girilen projelerin repo'su yok; GitHub projelerinde anahtar repo adıdır
            const ghRepo = project.repo || (manual ? manual.repo || null : (project.slug ? null : key));

            renderHeader(project, ghRepo, index, projects.length);
            renderNext(projects, index);
            $('source-label').textContent = mdPath ? 'Proje notu' : 'GitHub README';

            const local = mdPath ? fetchText(mdPath) : Promise.reject(new Error('no-local'));
            local
                .then(md => renderMarkdown(md, null))
                .catch(() => {
                    if (!ghRepo) throw new Error('no-source');
                    return fetchText(
                        `https://api.github.com/repos/${USER}/${encodeURIComponent(ghRepo)}/readme`,
                        'application/vnd.github.v3.raw'
                    ).then(md => renderMarkdown(md, ghRepo));
                })
                .catch(error => {
                    if (error && error.message === 'no-source') {
                        setStatus('Bu proje için ayrıntılı bir açıklama henüz yok.');
                        return;
                    }
                    const link = ghRepo
                        ? ` <a class="text-primary underline" target="_blank" rel="noopener" href="https://github.com/${USER}/${encodeURIComponent(ghRepo)}">GitHub'da açın</a>.`
                        : '';
                    setStatus(`İçerik şu an yüklenemedi.${link}`);
                });
        });
})();
</script>
